# asvs-v11-rules.yml
# Verifiable requirements distilled from OWASP ASVS 5.0.0 - V11 Cryptography.
meta:
  prefix: "ASVS"
  standard: "OWASP ASVS 5.0.0"
  source: "references/0x20-V11-Cryptography.md"
  chapter: "V11"
  title: "Cryptography"
  requirements: 24
  per_level: {L1: 3, L2: 11, L3: 10}
  cwe:
    mapped: 16
    mapping: "scripts/asvs-5.0.0-cwe-mapping.yml (derived from OWASP ASVS 5.0.be, indicative only)"
    catalogs:
      - "cwe.xml: CWE 4.20 (2026-04-30), VIEW LIST: CWE-699: Software Development"
      - "cwec_v4.20.xml: CWE 4.20 (2026-04-30), CWE"
  sections:
    - id: "V11.1"
      title: "Cryptographic Inventory and Documentation"
    - id: "V11.2"
      title: "Secure Cryptography Implementation"
    - id: "V11.3"
      title: "Encryption Algorithms"
    - id: "V11.4"
      title: "Hashing and Hash-based Functions"
    - id: "V11.5"
      title: "Random Values"
    - id: "V11.6"
      title: "Public Key Cryptography"
    - id: "V11.7"
      title: "In-Use Data Cryptography"
rules:
  - id: "ASVS-V11-11.1.1"
    section: "V11.1"
    level: 2
    rule: "There is a documented policy for management of cryptographic keys and a cryptographic key lifecycle that follows a key management standard such as NIST SP 800-57. This should include ensuring that keys are not overshared (for example, with more than two entities for shared secrets and more than one entity for private keys)."
    cwe:
      id: 320
      name: "Key Management Errors"
      abstraction: "Category"
      url: "https://cwe.mitre.org/data/definitions/320.html"
  - id: "ASVS-V11-11.1.2"
    section: "V11.1"
    level: 2
    rule: "A cryptographic inventory is performed, maintained, regularly updated, and includes all cryptographic keys, algorithms, and certificates used by the application. It must also document where keys can and cannot be used in the system, and the types of data that can and cannot be protected using the keys."
    cwe:
      id: 320
      name: "Key Management Errors"
      abstraction: "Category"
      url: "https://cwe.mitre.org/data/definitions/320.html"
  - id: "ASVS-V11-11.1.3"
    section: "V11.1"
    level: 3
    rule: "Cryptographic discovery mechanisms are employed to identify all instances of cryptography in the system, including encryption, hashing, and signing operations."
    cwe:
      id: 320
      name: "Key Management Errors"
      abstraction: "Category"
      url: "https://cwe.mitre.org/data/definitions/320.html"
  - id: "ASVS-V11-11.1.4"
    section: "V11.1"
    level: 3
    rule: "A cryptographic inventory is maintained. This must include a documented plan that outlines the migration path to new cryptographic standards, such as post-quantum cryptography, in order to react to future threats."
  - id: "ASVS-V11-11.2.1"
    section: "V11.2"
    level: 2
    rule: "Industry-validated implementations (including libraries and hardware-accelerated implementations) are used for cryptographic operations."
    cwe:
      id: 327
      name: "Use of a Broken or Risky Cryptographic Algorithm"
      abstraction: "Class"
      url: "https://cwe.mitre.org/data/definitions/327.html"
      note: "The confidentiality of sensitive data may be compromised by the use of a broken or risky cryptographic algorithm.\n\nThe integrity of sensitive data may be compromised by the use of a broken or risky cryptographic algorithm.\n\nIf the cryptographic algorithm is used to ensure the identity of the source of the data (such as digital signatures), then a broken algorithm will compromise this scheme and the source of the data cannot be proven."
  - id: "ASVS-V11-11.2.2"
    section: "V11.2"
    level: 2
    rule: "The application is designed with crypto agility such that random number, authenticated encryption, MAC, or hashing algorithms, key lengths, rounds, ciphers and modes can be reconfigured, upgraded, or swapped at any time, to protect against cryptographic breaks. Similarly, it must also be possible to replace keys and passwords and re-encrypt data. This will allow for seamless upgrades to post-quantum cryptography (PQC), once high-assurance implementations of approved PQC schemes or standards are widely available."
    cwe:
      id: 320
      name: "Key Management Errors"
      abstraction: "Category"
      url: "https://cwe.mitre.org/data/definitions/320.html"
  - id: "ASVS-V11-11.2.3"
    section: "V11.2"
    level: 2
    rule: "All cryptographic primitives utilize a minimum of 128-bits of security based on the algorithm, key size, and configuration. For example, a 256-bit ECC key provides roughly 128 bits of security where RSA requires a 3072-bit key to achieve 128 bits of security."
    cwe:
      id: 311
      name: "Missing Encryption of Sensitive Data"
      abstraction: "Class"
      url: "https://cwe.mitre.org/data/definitions/311.html"
      note: "If the application does not use a secure channel, such as SSL, to exchange sensitive information, it is possible for an attacker with access to the network traffic to sniff packets from the connection and uncover the data. This attack is not technically difficult, but does require physical access to some portion of the network over which the sensitive data travels. This access is usually somewhere near where the user is connected to the network (such as a colleague on the company network) but can be anywhere along the path from the user to the end server.\n\nOmitting the use of encryption in any program which transfers data over a network of any kind should be considered on par with delivering the data sent to each user on the local networks of both the sender and receiver. Worse, this omission allows for the injection of data into a stream of communication between two parties -- with no means for the victims to separate valid data from invalid. In this day of widespread network attacks and password collection sniffers, it is an unnecessary risk to omit encryption from the design of any system which might benefit from it."
  - id: "ASVS-V11-11.2.4"
    section: "V11.2"
    level: 3
    rule: "All cryptographic operations are constant-time, with no 'short-circuit' operations in comparisons, calculations, or returns, to avoid leaking information."
    cwe:
      id: 385
      name: "Covert Timing Channel"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/385.html"
      note: "Information exposure."
  - id: "ASVS-V11-11.2.5"
    section: "V11.2"
    level: 3
    rule: "All cryptographic modules fail securely, and errors are handled in a way that does not enable vulnerabilities, such as Padding Oracle attacks."
    cwe:
      id: 310
      name: "Cryptographic Issues"
      abstraction: "Category"
      url: "https://cwe.mitre.org/data/definitions/310.html"
  - id: "ASVS-V11-11.3.1"
    section: "V11.3"
    level: 1
    rule: "Insecure block modes (e.g., ECB) and weak padding schemes (e.g., PKCS#1 v1.5) are not used."
    cwe:
      id: 326
      name: "Inadequate Encryption Strength"
      abstraction: "Class"
      url: "https://cwe.mitre.org/data/definitions/326.html"
      note: "An attacker may be able to decrypt the data using brute force attacks."
  - id: "ASVS-V11-11.3.2"
    section: "V11.3"
    level: 1
    rule: "Only approved ciphers and modes such as AES with GCM are used."
    cwe:
      id: 326
      name: "Inadequate Encryption Strength"
      abstraction: "Class"
      url: "https://cwe.mitre.org/data/definitions/326.html"
      note: "An attacker may be able to decrypt the data using brute force attacks."
  - id: "ASVS-V11-11.3.3"
    section: "V11.3"
    level: 2
    rule: "Encrypted data is protected against unauthorized modification preferably by using an approved authenticated encryption method or by combining an approved encryption method with an approved MAC algorithm."
    cwe:
      id: 326
      name: "Inadequate Encryption Strength"
      abstraction: "Class"
      url: "https://cwe.mitre.org/data/definitions/326.html"
      note: "An attacker may be able to decrypt the data using brute force attacks."
  - id: "ASVS-V11-11.3.4"
    section: "V11.3"
    level: 3
    rule: "Nonces, initialization vectors, and other single-use numbers are not used for more than one encryption key and data-element pair. The method of generation must be appropriate for the algorithm being used."
    cwe:
      id: 326
      name: "Inadequate Encryption Strength"
      abstraction: "Class"
      url: "https://cwe.mitre.org/data/definitions/326.html"
      note: "An attacker may be able to decrypt the data using brute force attacks."
  - id: "ASVS-V11-11.3.5"
    section: "V11.3"
    level: 3
    rule: "Any combination of an encryption algorithm and a MAC algorithm is operating in encrypt-then-MAC mode."
    cwe:
      id: 326
      name: "Inadequate Encryption Strength"
      abstraction: "Class"
      url: "https://cwe.mitre.org/data/definitions/326.html"
      note: "An attacker may be able to decrypt the data using brute force attacks."
  - id: "ASVS-V11-11.4.1"
    section: "V11.4"
    level: 1
    rule: "Only approved hash functions are used for general cryptographic use cases, including digital signatures, HMAC, KDF, and random bit generation. Disallowed hash functions, such as MD5, must not be used for any cryptographic purpose."
  - id: "ASVS-V11-11.4.2"
    section: "V11.4"
    level: 2
    rule: "Passwords are stored using an approved, computationally intensive, key derivation function (also known as a \"password hashing function\"), with parameter settings configured based on current guidance. The settings should balance security and performance to make brute-force attacks sufficiently challenging for the required level of security."
  - id: "ASVS-V11-11.4.3"
    section: "V11.4"
    level: 2
    rule: "Hash functions used in digital signatures, as part of data authentication or data integrity are collision resistant and have appropriate bit-lengths. If collision resistance is required, the output length must be at least 256 bits. If only resistance to second pre-image attacks is required, the output length must be at least 128 bits."
  - id: "ASVS-V11-11.4.4"
    section: "V11.4"
    level: 2
    rule: "The application uses approved key derivation functions with key stretching parameters when deriving secret keys from passwords. The parameters in use must balance security and performance to prevent brute-force attacks from compromising the resulting cryptographic key."
  - id: "ASVS-V11-11.5.1"
    section: "V11.5"
    level: 2
    rule: "All random numbers and strings which are intended to be non-guessable must be generated using a cryptographically secure pseudo-random number generator (CSPRNG) and have at least 128 bits of entropy. Note that UUIDs do not respect this condition."
    cwe:
      id: 338
      name: "Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/338.html"
      note: "If a PRNG is used for authentication and authorization, such as a session ID or a seed for generating a cryptographic key, then an attacker may be able to easily guess the ID or cryptographic key and gain access to restricted functionality."
  - id: "ASVS-V11-11.5.2"
    section: "V11.5"
    level: 3
    rule: "The random number generation mechanism in use is designed to work securely, even under heavy demand."
    cwe:
      id: 338
      name: "Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/338.html"
      note: "If a PRNG is used for authentication and authorization, such as a session ID or a seed for generating a cryptographic key, then an attacker may be able to easily guess the ID or cryptographic key and gain access to restricted functionality."
  - id: "ASVS-V11-11.6.1"
    section: "V11.6"
    level: 2
    rule: "Only approved cryptographic algorithms and modes of operation are used for key generation and seeding, and digital signature generation and verification. Key generation algorithms must not generate insecure keys vulnerable to known attacks, for example, RSA keys which are vulnerable to Fermat factorization."
    cwe:
      id: 327
      name: "Use of a Broken or Risky Cryptographic Algorithm"
      abstraction: "Class"
      url: "https://cwe.mitre.org/data/definitions/327.html"
      note: "The confidentiality of sensitive data may be compromised by the use of a broken or risky cryptographic algorithm.\n\nThe integrity of sensitive data may be compromised by the use of a broken or risky cryptographic algorithm.\n\nIf the cryptographic algorithm is used to ensure the identity of the source of the data (such as digital signatures), then a broken algorithm will compromise this scheme and the source of the data cannot be proven."
  - id: "ASVS-V11-11.6.2"
    section: "V11.6"
    level: 3
    rule: "Approved cryptographic algorithms are used for key exchange (such as Diffie-Hellman) with a focus on ensuring that key exchange mechanisms use secure parameters. This will prevent attacks on the key establishment process which could lead to adversary-in-the-middle attacks or cryptographic breaks."
  - id: "ASVS-V11-11.7.1"
    section: "V11.7"
    level: 3
    rule: "Full memory encryption is in use that protects sensitive data while it is in use, preventing access by unauthorized users or processes."
  - id: "ASVS-V11-11.7.2"
    section: "V11.7"
    level: 3
    rule: "Data minimization ensures the minimal amount of data is exposed during processing, and ensure that data is encrypted immediately after use or as soon as feasible."

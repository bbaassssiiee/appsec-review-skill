# asvs-v5-rules.yml
# Verifiable requirements distilled from OWASP ASVS 5.0.0 - V5 File Handling.
meta:
  prefix: "ASVS"
  standard: "OWASP ASVS 5.0.0"
  source: "references/0x14-V5-File-Handling.md"
  chapter: "V5"
  title: "File Handling"
  requirements: 13
  per_level: {L1: 4, L2: 5, L3: 4}
  cwe:
    mapped: 11
    mapping: "scripts/asvs-5.0.0-cwe-mapping.yml (derived from OWASP ASVS 5.0.be, indicative only)"
    catalogs:
      - "cwe.xml: CWE 4.20 (2026-04-30), VIEW LIST: CWE-699: Software Development"
      - "cwec_v4.20.xml: CWE 4.20 (2026-04-30), CWE"
  sections:
    - id: "V5.1"
      title: "File Handling Documentation"
    - id: "V5.2"
      title: "File Upload and Content"
    - id: "V5.3"
      title: "File Storage"
    - id: "V5.4"
      title: "File Download"
rules:
  - id: "ASVS-V5-5.1.1"
    section: "V5.1"
    level: 2
    rule: "The documentation defines the permitted file types, expected file extensions, and maximum size (including unpacked size) for each upload feature. Additionally, ensure that the documentation specifies how files are made safe for end-users to download and process, such as how the application behaves when a malicious file is detected."
  - id: "ASVS-V5-5.2.1"
    section: "V5.2"
    level: 1
    rule: "The application will only accept files of a size which it can process without causing a loss of performance or a denial of service attack."
    cwe:
      id: 400
      name: "Uncontrolled Resource Consumption"
      abstraction: "Class"
      url: "https://cwe.mitre.org/data/definitions/400.html"
      note: "If an attacker can trigger the allocation of the limited resources, but the number or size of the resources is not controlled, then the most common result is denial of service. This would prevent valid users from accessing the product, and it could potentially have an impact on the surrounding environment, i.e., the product may slow down, crash due to unhandled errors, or lock out legitimate users. For example, a memory exhaustion attack against an application could slow down the application as well as its host operating system.\n\nIn some cases it may be possible to force the product to \"fail open\" in the event of resource exhaustion. The state of the product -- and possibly the security functionality - may then be compromised."
  - id: "ASVS-V5-5.2.2"
    section: "V5.2"
    level: 1
    rule: "When the application accepts a file, either on its own or within an archive such as a zip file, it checks if the file extension matches an expected file extension and validates that the contents correspond to the type represented by the extension. This includes, but is not limited to, checking the initial 'magic bytes', performing image re-writing, and using specialized libraries for file content validation. For L1, this can focus just on files which are used to make specific business or security decisions. For L2 and up, this must apply to all files being accepted."
    cwe:
      id: 434
      name: "Unrestricted Upload of File with Dangerous Type"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/434.html"
      note: "Arbitrary code execution is possible if an uploaded file is interpreted and executed as code by the recipient. This is especially true for web-server extensions such as .asp and .php because these file types are often treated as automatically executable, even when file system permissions do not specify execution. For example, in Unix environments, programs typically cannot run unless the execute bit is set, but PHP programs may be executed by the web server without directly invoking them on the operating system."
  - id: "ASVS-V5-5.2.3"
    section: "V5.2"
    level: 2
    rule: "The application checks compressed files (e.g., zip, gz, docx, odt) against maximum allowed uncompressed size and against maximum number of files before uncompressing the file."
    cwe:
      id: 409
      name: "Improper Handling of Highly Compressed Data (Data Amplification)"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/409.html"
      note: "System resources, CPU and memory, can be quickly consumed. This can lead to poor system performance or system crash."
  - id: "ASVS-V5-5.2.4"
    section: "V5.2"
    level: 3
    rule: "A file size quota and maximum number of files per user are enforced to ensure that a single user cannot fill up the storage with too many files, or excessively large files."
    cwe:
      id: 770
      name: "Allocation of Resources Without Limits or Throttling"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/770.html"
      note: "When allocating resources without limits, an attacker could prevent other systems, applications, or processes from accessing the same type of resource. It can be easy for an attacker to consume many resources by rapidly making many requests or causing larger resources to be used than is needed."
  - id: "ASVS-V5-5.2.5"
    section: "V5.2"
    level: 3
    rule: "The application does not allow uploading compressed files containing symlinks unless this is specifically required (in which case it will be necessary to enforce an allowlist of the files that can be symlinked to)."
    cwe:
      id: 61
      name: "UNIX Symbolic Link (Symlink) Following"
      abstraction: "Compound"
      url: "https://cwe.mitre.org/data/definitions/61.html"
  - id: "ASVS-V5-5.2.6"
    section: "V5.2"
    level: 3
    rule: "The application rejects uploaded images with a pixel size larger than the maximum allowed, to prevent pixel flood attacks."
    cwe:
      id: 400
      name: "Uncontrolled Resource Consumption"
      abstraction: "Class"
      url: "https://cwe.mitre.org/data/definitions/400.html"
      note: "If an attacker can trigger the allocation of the limited resources, but the number or size of the resources is not controlled, then the most common result is denial of service. This would prevent valid users from accessing the product, and it could potentially have an impact on the surrounding environment, i.e., the product may slow down, crash due to unhandled errors, or lock out legitimate users. For example, a memory exhaustion attack against an application could slow down the application as well as its host operating system.\n\nIn some cases it may be possible to force the product to \"fail open\" in the event of resource exhaustion. The state of the product -- and possibly the security functionality - may then be compromised."
  - id: "ASVS-V5-5.3.1"
    section: "V5.3"
    level: 1
    rule: "Files uploaded or generated by untrusted input and stored in a public folder, are not executed as server-side program code when accessed directly with an HTTP request."
    cwe:
      id: 552
      name: "Files or Directories Accessible to External Parties"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/552.html"
  - id: "ASVS-V5-5.3.2"
    section: "V5.3"
    level: 1
    rule: "When the application creates file paths for file operations, instead of user-submitted filenames, it uses internally generated or trusted data, or if user-submitted filenames or file metadata must be used, strict validation and sanitization must be applied. This is to protect against path traversal, local or remote file inclusion (LFI, RFI), and server-side request forgery (SSRF) attacks."
    cwe:
      id: 73
      name: "External Control of File Name or Path"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/73.html"
      note: "The application can operate on unexpected files. Confidentiality is violated when the targeted filename is not directly readable by the attacker.\n\nThe application can operate on unexpected files. This may violate integrity if the filename is written to, or if the filename is for a program or other form of executable code.\n\nThe application can operate on unexpected files. Availability can be violated if the attacker specifies an unexpected file that the application modifies. Availability can also be affected if the attacker specifies a filename for a large file, or points to a special device or a file that does not have the format that the application expects."
  - id: "ASVS-V5-5.3.3"
    section: "V5.3"
    level: 3
    rule: "Server-side file processing, such as file decompression, ignores user-provided path information to prevent vulnerabilities such as zip slip."
    cwe:
      id: 23
      name: "Relative Path Traversal"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/23.html"
      note: "The attacker may be able to create or overwrite critical files that are used to execute code, such as programs or libraries.\n\nThe attacker may be able to overwrite or create critical files, such as programs, libraries, or important data. If the targeted file is used for a security mechanism, then the attacker may be able to bypass that mechanism. For example, appending a new account at the end of a password file may allow an attacker to bypass authentication.\n\nThe attacker may be able read the contents of unexpected files and expose sensitive data by traversing the file system to access files or directories that are outside of the restricted directory. If the targeted file is used for a security mechanism, then the attacker may be able to bypass that mechanism. For example, by reading a password file, the attacker could conduct brute force password guessing attacks in order to break into an account on the system.\n\nThe attacker may be able to overwrite, delete, or corrupt unexpected critical files such as programs, libraries, or important data. This may prevent the product from working at all and in the case of a protection mechanisms such as authentication, it has the potential to lockout every user of the product."
  - id: "ASVS-V5-5.4.1"
    section: "V5.4"
    level: 2
    rule: "The application validates or ignores user-submitted filenames, including in a JSON, JSONP, or URL parameter and specifies a filename in the Content-Disposition header field in the response."
    cwe:
      id: 641
      name: "Improper Restriction of Names for Files and Other Resources"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/641.html"
      note: "Execution of arbitrary code in the context of usage of the resources with dangerous names.\n\nCrash of the consumer code of these resources resulting in information leakage or denial of service."
  - id: "ASVS-V5-5.4.2"
    section: "V5.4"
    level: 2
    rule: "File names served (e.g., in HTTP response header fields or email attachments) are encoded or sanitized (e.g., following RFC 6266) to preserve document structure and prevent injection attacks."
  - id: "ASVS-V5-5.4.3"
    section: "V5.4"
    level: 2
    rule: "Files obtained from untrusted sources are scanned by antivirus scanners to prevent serving of known malicious content."
    cwe:
      id: 509
      name: "Replicating Malicious Code (Virus or Worm)"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/509.html"

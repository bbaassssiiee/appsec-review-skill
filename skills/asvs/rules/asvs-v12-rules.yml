# asvs-v12-rules.yml
# Verifiable requirements distilled from OWASP ASVS 5.0.0 - V12 Secure Communication.
meta:
  prefix: "ASVS"
  standard: "OWASP ASVS 5.0.0"
  source: "references/0x21-V12-Secure-Communication.md"
  chapter: "V12"
  title: "Secure Communication"
  requirements: 12
  per_level: {L1: 3, L2: 6, L3: 3}
  cwe:
    mapped: 9
    mapping: "scripts/asvs-5.0.0-cwe-mapping.yml (derived from OWASP ASVS 5.0.be, indicative only)"
    catalogs:
      - "cwe.xml: CWE 4.20 (2026-04-30), VIEW LIST: CWE-699: Software Development"
      - "cwec_v4.20.xml: CWE 4.20 (2026-04-30), CWE"
  sections:
    - id: "V12.1"
      title: "General TLS Security Guidance"
    - id: "V12.2"
      title: "HTTPS Communication with External Facing Services"
    - id: "V12.3"
      title: "General Service to Service Communication Security"
rules:
  - id: "ASVS-V12-12.1.1"
    section: "V12.1"
    level: 1
    rule: "Only the latest recommended versions of the TLS protocol are enabled, such as TLS 1.2 and TLS 1.3. The latest version of the TLS protocol must be the preferred option."
    cwe:
      id: 326
      name: "Inadequate Encryption Strength"
      abstraction: "Class"
      url: "https://cwe.mitre.org/data/definitions/326.html"
      note: "An attacker may be able to decrypt the data using brute force attacks."
  - id: "ASVS-V12-12.1.2"
    section: "V12.1"
    level: 2
    rule: "Only recommended cipher suites are enabled, with the strongest cipher suites set as preferred. L3 applications must only support cipher suites which provide forward secrecy."
    cwe:
      id: 326
      name: "Inadequate Encryption Strength"
      abstraction: "Class"
      url: "https://cwe.mitre.org/data/definitions/326.html"
      note: "An attacker may be able to decrypt the data using brute force attacks."
  - id: "ASVS-V12-12.1.3"
    section: "V12.1"
    level: 2
    rule: "The application validates that mTLS client certificates are trusted before using the certificate identity for authentication or authorization."
  - id: "ASVS-V12-12.1.4"
    section: "V12.1"
    level: 3
    rule: "Proper certification revocation, such as Online Certificate Status Protocol (OCSP) Stapling, is enabled and configured."
    cwe:
      id: 299
      name: "Improper Check for Certificate Revocation"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/299.html"
      note: "Trust may be assigned to an entity who is not who it claims to be.\n\nData from an untrusted (and possibly malicious) source may be integrated.\n\nData may be disclosed to an entity impersonating a trusted entity, resulting in information disclosure."
  - id: "ASVS-V12-12.1.5"
    section: "V12.1"
    level: 3
    rule: "Encrypted Client Hello (ECH) is enabled in the application's TLS settings to prevent exposure of sensitive metadata, such as the Server Name Indication (SNI), during TLS handshake processes."
  - id: "ASVS-V12-12.2.1"
    section: "V12.2"
    level: 1
    rule: "TLS is used for all connectivity between a client and external facing, HTTP-based services, and does not fall back to insecure or unencrypted communications."
    cwe:
      id: 319
      name: "Cleartext Transmission of Sensitive Information"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/319.html"
      note: "Anyone can read the information by gaining access to the channel being used for communication. Many communication channels can be \"sniffed\" (monitored) by adversaries during data transmission. For example, in networking, packets can traverse many intermediary nodes from the source to the destination, whether across the internet, an internal network, the cloud, etc. Some actors might have privileged access to a network interface or any link along the channel, such as a router, but they might not be authorized to collect the underlying data. As a result, network traffic could be sniffed by adversaries, spilling security-critical data.\n\nWhen full communications are recorded or logged, such as with a packet dump, an adversary could attempt to obtain the dump long after the transmission has occurred and try to \"sniff\" the cleartext from the recorded communications in the dump itself. Even if the information is encoded in a way that is not human-readable, certain techniques could determine which encoding is being used, then decode the information."
  - id: "ASVS-V12-12.2.2"
    section: "V12.2"
    level: 1
    rule: "External facing services use publicly trusted TLS certificates."
    cwe:
      id: 295
      name: "Improper Certificate Validation"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/295.html"
      note: "When a certificate is invalid or malicious, it might allow an attacker to spoof a trusted entity by interfering in the communication path between the host and client. The product might connect to a malicious host while believing it is a trusted host, or the product might be deceived into accepting spoofed data that appears to originate from a trusted host."
  - id: "ASVS-V12-12.3.1"
    section: "V12.3"
    level: 2
    rule: "An encrypted protocol such as TLS is used for all inbound and outbound connections to and from the application, including monitoring systems, management tools, remote access and SSH, middleware, databases, mainframes, partner systems, or external APIs. The server must not fall back to insecure or unencrypted protocols."
    cwe:
      id: 319
      name: "Cleartext Transmission of Sensitive Information"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/319.html"
      note: "Anyone can read the information by gaining access to the channel being used for communication. Many communication channels can be \"sniffed\" (monitored) by adversaries during data transmission. For example, in networking, packets can traverse many intermediary nodes from the source to the destination, whether across the internet, an internal network, the cloud, etc. Some actors might have privileged access to a network interface or any link along the channel, such as a router, but they might not be authorized to collect the underlying data. As a result, network traffic could be sniffed by adversaries, spilling security-critical data.\n\nWhen full communications are recorded or logged, such as with a packet dump, an adversary could attempt to obtain the dump long after the transmission has occurred and try to \"sniff\" the cleartext from the recorded communications in the dump itself. Even if the information is encoded in a way that is not human-readable, certain techniques could determine which encoding is being used, then decode the information."
  - id: "ASVS-V12-12.3.2"
    section: "V12.3"
    level: 2
    rule: "TLS clients validate certificates received before communicating with a TLS server."
  - id: "ASVS-V12-12.3.3"
    section: "V12.3"
    level: 2
    rule: "TLS or another appropriate transport encryption mechanism used for all connectivity between internal, HTTP-based services within the application, and does not fall back to insecure or unencrypted communications."
    cwe:
      id: 319
      name: "Cleartext Transmission of Sensitive Information"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/319.html"
      note: "Anyone can read the information by gaining access to the channel being used for communication. Many communication channels can be \"sniffed\" (monitored) by adversaries during data transmission. For example, in networking, packets can traverse many intermediary nodes from the source to the destination, whether across the internet, an internal network, the cloud, etc. Some actors might have privileged access to a network interface or any link along the channel, such as a router, but they might not be authorized to collect the underlying data. As a result, network traffic could be sniffed by adversaries, spilling security-critical data.\n\nWhen full communications are recorded or logged, such as with a packet dump, an adversary could attempt to obtain the dump long after the transmission has occurred and try to \"sniff\" the cleartext from the recorded communications in the dump itself. Even if the information is encoded in a way that is not human-readable, certain techniques could determine which encoding is being used, then decode the information."
  - id: "ASVS-V12-12.3.4"
    section: "V12.3"
    level: 2
    rule: "TLS connections between internal services use trusted certificates. Where internally generated or self-signed certificates are used, the consuming service must be configured to only trust specific internal CAs and specific self-signed certificates."
    cwe:
      id: 295
      name: "Improper Certificate Validation"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/295.html"
      note: "When a certificate is invalid or malicious, it might allow an attacker to spoof a trusted entity by interfering in the communication path between the host and client. The product might connect to a malicious host while believing it is a trusted host, or the product might be deceived into accepting spoofed data that appears to originate from a trusted host."
  - id: "ASVS-V12-12.3.5"
    section: "V12.3"
    level: 3
    rule: "Services communicating internally within a system (intra-service communications) use strong authentication to ensure that each endpoint is verified. Strong authentication methods, such as TLS client authentication, must be employed to ensure identity, using public-key infrastructure and mechanisms that are resistant to replay attacks. For microservice architectures, consider using a service mesh to simplify certificate management and enhance security."
    cwe:
      id: 295
      name: "Improper Certificate Validation"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/295.html"
      note: "When a certificate is invalid or malicious, it might allow an attacker to spoof a trusted entity by interfering in the communication path between the host and client. The product might connect to a malicious host while believing it is a trusted host, or the product might be deceived into accepting spoofed data that appears to originate from a trusted host."

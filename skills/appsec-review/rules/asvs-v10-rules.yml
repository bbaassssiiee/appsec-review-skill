# asvs-v10-rules.yml
# Verifiable requirements distilled from OWASP ASVS 5.0.0 - V10 OAuth and OIDC.
meta:
  prefix: "ASVS"
  standard: "OWASP ASVS 5.0.0"
  source: "references/0x19-V10-OAuth-and-OIDC.md"
  chapter: "V10"
  title: "OAuth and OIDC"
  requirements: 36
  per_level: {L1: 5, L2: 24, L3: 7}
  cwe:
    mapped: 0
    mapping: "scripts/asvs-5.0.0-cwe-mapping.yml (derived from OWASP ASVS 5.0.be, indicative only)"
    catalogs:
      - "cwe.xml: CWE 4.20 (2026-04-30), VIEW LIST: CWE-699: Software Development"
      - "cwec_v4.20.xml: CWE 4.20 (2026-04-30), CWE"
  sections:
    - id: "V10.1"
      title: "Generic OAuth and OIDC Security"
    - id: "V10.2"
      title: "OAuth Client"
    - id: "V10.3"
      title: "OAuth Resource Server"
    - id: "V10.4"
      title: "OAuth Authorization Server"
    - id: "V10.5"
      title: "OIDC Client"
    - id: "V10.6"
      title: "OpenID Provider"
    - id: "V10.7"
      title: "Consent Management"
rules:
  - id: "ASVS-V10-10.1.1"
    section: "V10.1"
    level: 2
    rule: "Tokens are only sent to components that strictly need them. For example, when using a backend-for-frontend pattern for browser-based JavaScript applications, access and refresh tokens shall only be accessible for the backend."
  - id: "ASVS-V10-10.1.2"
    section: "V10.1"
    level: 2
    rule: "The client only accepts values from the authorization server (such as the authorization code or ID Token) if these values result from an authorization flow that was initiated by the same user agent session and transaction. This requires that client-generated secrets, such as the proof key for code exchange (PKCE) 'code_verifier', 'state' or OIDC 'nonce', are not guessable, are specific to the transaction, and are securely bound to both the client and the user agent session in which the transaction was started."
  - id: "ASVS-V10-10.2.1"
    section: "V10.2"
    level: 2
    rule: "Verify that, if the code flow is used, the OAuth client has protection against browser-based request forgery attacks, commonly known as cross-site request forgery (CSRF), which trigger token requests, either by using proof key for code exchange (PKCE) functionality or checking the 'state' parameter that was sent in the authorization request."
  - id: "ASVS-V10-10.2.2"
    section: "V10.2"
    level: 2
    rule: "Verify that, if the OAuth client can interact with more than one authorization server, it has a defense against mix-up attacks. For example, it could require that the authorization server return the 'iss' parameter value and validate it in the authorization response and the token response."
  - id: "ASVS-V10-10.2.3"
    section: "V10.2"
    level: 3
    rule: "The OAuth client only requests the required scopes (or other authorization parameters) in requests to the authorization server."
  - id: "ASVS-V10-10.3.1"
    section: "V10.3"
    level: 2
    rule: "The resource server only accepts access tokens that are intended for use with that service (audience). The audience may be included in a structured access token (such as the 'aud' claim in JWT), or it can be checked using the token introspection endpoint."
  - id: "ASVS-V10-10.3.2"
    section: "V10.3"
    level: 2
    rule: "The resource server enforces authorization decisions based on claims from the access token that define delegated authorization. If claims such as 'sub', 'scope', and 'authorization_details' are present, they must be part of the decision."
  - id: "ASVS-V10-10.3.3"
    section: "V10.3"
    level: 2
    rule: "If an access control decision requires identifying a unique user from an access token (JWT or related token introspection response), the resource server identifies the user from claims that cannot be reassigned to other users. Typically, it means using a combination of 'iss' and 'sub' claims."
  - id: "ASVS-V10-10.3.4"
    section: "V10.3"
    level: 2
    rule: "Verify that, if the resource server requires specific authentication strength, methods, or recentness, it verifies that the presented access token satisfies these constraints. For example, if present, using the OIDC 'acr', 'amr' and 'auth_time' claims respectively."
  - id: "ASVS-V10-10.3.5"
    section: "V10.3"
    level: 3
    rule: "The resource server prevents the use of stolen access tokens or replay of access tokens (from unauthorized parties) by requiring sender-constrained access tokens, either Mutual TLS for OAuth 2 or OAuth 2 Demonstration of Proof of Possession (DPoP)."
  - id: "ASVS-V10-10.4.1"
    section: "V10.4"
    level: 1
    rule: "The authorization server validates redirect URIs based on a client-specific allowlist of pre-registered URIs using exact string comparison."
  - id: "ASVS-V10-10.4.2"
    section: "V10.4"
    level: 1
    rule: "Verify that, if the authorization server returns the authorization code in the authorization response, it can be used only once for a token request. For the second valid request with an authorization code that has already been used to issue an access token, the authorization server must reject a token request and revoke any issued tokens related to the authorization code."
  - id: "ASVS-V10-10.4.3"
    section: "V10.4"
    level: 1
    rule: "The authorization code is short-lived. The maximum lifetime can be up to 10 minutes for L1 and L2 applications and up to 1 minute for L3 applications."
  - id: "ASVS-V10-10.4.4"
    section: "V10.4"
    level: 1
    rule: "For a given client, the authorization server only allows the usage of grants that this client needs to use. Note that the grants 'token' (Implicit flow) and 'password' (Resource Owner Password Credentials flow) must no longer be used."
  - id: "ASVS-V10-10.4.5"
    section: "V10.4"
    level: 1
    rule: "The authorization server mitigates refresh token replay attacks for public clients, preferably using sender-constrained refresh tokens, i.e., Demonstrating Proof of Possession (DPoP) or Certificate-Bound Access Tokens using mutual TLS (mTLS). For L1 and L2 applications, refresh token rotation may be used. If refresh token rotation is used, the authorization server must invalidate the refresh token after usage, and revoke all refresh tokens for that authorization if an already used and invalidated refresh token is provided."
  - id: "ASVS-V10-10.4.6"
    section: "V10.4"
    level: 2
    rule: "Verify that, if the code grant is used, the authorization server mitigates authorization code interception attacks by requiring proof key for code exchange (PKCE). For authorization requests, the authorization server must require a valid 'code_challenge' value and must not accept a 'code_challenge_method' value of 'plain'. For a token request, it must require validation of the 'code_verifier' parameter."
  - id: "ASVS-V10-10.4.7"
    section: "V10.4"
    level: 2
    rule: "If the authorization server supports unauthenticated dynamic client registration, it mitigates the risk of malicious client applications. It must validate client metadata such as any registered URIs, ensure the user's consent, and warn the user before processing an authorization request with an untrusted client application."
  - id: "ASVS-V10-10.4.8"
    section: "V10.4"
    level: 2
    rule: "Refresh tokens have an absolute expiration, including if sliding refresh token expiration is applied."
  - id: "ASVS-V10-10.4.9"
    section: "V10.4"
    level: 2
    rule: "Refresh tokens and reference access tokens can be revoked by an authorized user using the authorization server user interface, to mitigate the risk of malicious clients or stolen tokens."
  - id: "ASVS-V10-10.4.10"
    section: "V10.4"
    level: 2
    rule: "Confidential client is authenticated for client-to-authorized server backchannel requests such as token requests, pushed authorization requests (PAR), and token revocation requests."
  - id: "ASVS-V10-10.4.11"
    section: "V10.4"
    level: 2
    rule: "The authorization server configuration only assigns the required scopes to the OAuth client."
  - id: "ASVS-V10-10.4.12"
    section: "V10.4"
    level: 3
    rule: "For a given client, the authorization server only allows the 'response_mode' value that this client needs to use. For example, by having the authorization server validate this value against the expected values or by using pushed authorization request (PAR) or JWT-secured Authorization Request (JAR)."
  - id: "ASVS-V10-10.4.13"
    section: "V10.4"
    level: 3
    rule: "Grant type 'code' is always used together with pushed authorization requests (PAR)."
  - id: "ASVS-V10-10.4.14"
    section: "V10.4"
    level: 3
    rule: "The authorization server issues only sender-constrained (Proof-of-Possession) access tokens, either with certificate-bound access tokens using mutual TLS (mTLS) or DPoP-bound access tokens (Demonstration of Proof of Possession)."
  - id: "ASVS-V10-10.4.15"
    section: "V10.4"
    level: 3
    rule: "Verify that, for a server-side client (which is not executed on the end-user device), the authorization server ensures that the 'authorization_details' parameter value is from the client backend and that the user has not tampered with it. For example, by requiring the usage of pushed authorization request (PAR) or JWT-secured Authorization Request (JAR)."
  - id: "ASVS-V10-10.4.16"
    section: "V10.4"
    level: 3
    rule: "The client is confidential and the authorization server requires the use of strong client authentication methods (based on public-key cryptography and resistant to replay attacks), such as mutual TLS ('tls_client_auth', 'self_signed_tls_client_auth') or private key JWT ('private_key_jwt')."
  - id: "ASVS-V10-10.5.1"
    section: "V10.5"
    level: 2
    rule: "The client (as the relying party) mitigates ID Token replay attacks. For example, by ensuring that the 'nonce' claim in the ID Token matches the 'nonce' value sent in the authentication request to the OpenID Provider (in OAuth2 refereed to as the authorization request sent to the authorization server)."
  - id: "ASVS-V10-10.5.2"
    section: "V10.5"
    level: 2
    rule: "The client uniquely identifies the user from ID Token claims, usually the 'sub' claim, which cannot be reassigned to other users (for the scope of an identity provider)."
  - id: "ASVS-V10-10.5.3"
    section: "V10.5"
    level: 2
    rule: "The client rejects attempts by a malicious authorization server to impersonate another authorization server through authorization server metadata. The client must reject authorization server metadata if the issuer URL in the authorization server metadata does not exactly match the pre-configured issuer URL expected by the client."
  - id: "ASVS-V10-10.5.4"
    section: "V10.5"
    level: 2
    rule: "The client validates that the ID Token is intended to be used for that client (audience) by checking that the 'aud' claim from the token is equal to the 'client_id' value for the client."
  - id: "ASVS-V10-10.5.5"
    section: "V10.5"
    level: 2
    rule: "Verify that, when using OIDC back-channel logout, the relying party mitigates denial of service through forced logout and cross-JWT confusion in the logout flow. The client must verify that the logout token is correctly typed with a value of 'logout+jwt', contains the 'event' claim with the correct member name, and does not contain a 'nonce' claim. Note that it is also recommended to have a short expiration (e.g., 2 minutes)."
  - id: "ASVS-V10-10.6.1"
    section: "V10.6"
    level: 2
    rule: "The OpenID Provider only allows values 'code', 'ciba', 'id_token', or 'id_token code' for response mode. Note that 'code' is preferred over 'id_token code' (the OIDC Hybrid flow), and 'token' (any Implicit flow) must not be used."
  - id: "ASVS-V10-10.6.2"
    section: "V10.6"
    level: 2
    rule: "The OpenID Provider mitigates denial of service through forced logout. By obtaining explicit confirmation from the end-user or, if present, validating parameters in the logout request (initiated by the relying party), such as the 'id_token_hint'."
  - id: "ASVS-V10-10.7.1"
    section: "V10.7"
    level: 2
    rule: "The authorization server ensures that the user consents to each authorization request. If the identity of the client cannot be assured, the authorization server must always explicitly prompt the user for consent."
  - id: "ASVS-V10-10.7.2"
    section: "V10.7"
    level: 2
    rule: "When the authorization server prompts for user consent, it presents sufficient and clear information about what is being consented to. When applicable, this should include the nature of the requested authorizations (typically based on scope, resource server, Rich Authorization Requests (RAR) authorization details), the identity of the authorized application, and the lifetime of these authorizations."
  - id: "ASVS-V10-10.7.3"
    section: "V10.7"
    level: 2
    rule: "The user can review, modify, and revoke consents which the user has granted through the authorization server."

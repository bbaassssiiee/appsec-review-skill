# asvs-v8-rules.yml
# Verifiable requirements distilled from OWASP ASVS 5.0.0 - V8 Authorization.
meta:
  prefix: "ASVS"
  standard: "OWASP ASVS 5.0.0"
  source: "references/0x17-V8-Authorization.md"
  chapter: "V8"
  title: "Authorization"
  requirements: 13
  per_level: {L1: 4, L2: 3, L3: 6}
  cwe:
    mapped: 7
    mapping: "scripts/asvs-5.0.0-cwe-mapping.yml (derived from OWASP ASVS 5.0.be, indicative only)"
    catalogs:
      - "cwe.xml: CWE 4.20 (2026-04-30), VIEW LIST: CWE-699: Software Development"
      - "cwec_v4.20.xml: CWE 4.20 (2026-04-30), CWE"
  sections:
    - id: "V8.1"
      title: "Authorization Documentation"
    - id: "V8.2"
      title: "General Authorization Design"
    - id: "V8.3"
      title: "Operation Level Authorization"
    - id: "V8.4"
      title: "Other Authorization Considerations"
rules:
  - id: "ASVS-V8-8.1.1"
    section: "V8.1"
    level: 1
    rule: "Authorization documentation defines rules for restricting function-level and data-specific access based on consumer permissions and resource attributes."
  - id: "ASVS-V8-8.1.2"
    section: "V8.1"
    level: 2
    rule: "Authorization documentation defines rules for field-level access restrictions (both read and write) based on consumer permissions and resource attributes. Note that these rules might depend on other attribute values of the relevant data object, such as state or status."
  - id: "ASVS-V8-8.1.3"
    section: "V8.1"
    level: 3
    rule: "The application's documentation defines the environmental and contextual attributes (including but not limited to, time of day, user location, IP address, or device) that are used in the application to make security decisions, including those pertaining to authentication and authorization."
  - id: "ASVS-V8-8.1.4"
    section: "V8.1"
    level: 3
    rule: "Authentication and authorization documentation defines how environmental and contextual factors are used in decision-making, in addition to function-level, data-specific, and field-level authorization. This should include the attributes evaluated, thresholds for risk, and actions taken (e.g., allow, challenge, deny, step-up authentication)."
  - id: "ASVS-V8-8.2.1"
    section: "V8.2"
    level: 1
    rule: "The application ensures that function-level access is restricted to consumers with explicit permissions."
    cwe:
      id: 285
      name: "Improper Authorization"
      abstraction: "Class"
      url: "https://cwe.mitre.org/data/definitions/285.html"
      note: "An attacker could read sensitive data, either by reading the data directly from a data store that is not properly restricted, or by accessing insufficiently-protected, privileged functionality to read the data.\n\nAn attacker could modify sensitive data, either by writing the data directly to a data store that is not properly restricted, or by accessing insufficiently-protected, privileged functionality to write the data.\n\nWhen access control checks are not applied consistently - or not at all - an attacker could gain privileges and execute unauthorized code or commands by modifying or reading critical data directly, or by accessing insufficiently-protected, privileged functionality."
  - id: "ASVS-V8-8.2.2"
    section: "V8.2"
    level: 1
    rule: "The application ensures that data-specific access is restricted to consumers with explicit permissions to specific data items to mitigate insecure direct object reference (IDOR) and broken object level authorization (BOLA)."
    cwe:
      id: 639
      name: "Authorization Bypass Through User-Controlled Key"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/639.html"
      note: "Access control checks for specific user data or functionality can be bypassed.\n\nHorizontal escalation of privilege is possible (one user can view/modify information of another user).\n\nVertical escalation of privilege is possible if the user-controlled key is actually a flag that indicates administrator status, allowing the attacker to gain administrative access."
  - id: "ASVS-V8-8.2.3"
    section: "V8.2"
    level: 2
    rule: "The application ensures that field-level access is restricted to consumers with explicit permissions to specific fields to mitigate broken object property level authorization (BOPLA)."
    cwe:
      id: 283
      name: "Unverified Ownership"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/283.html"
      note: "An attacker could gain unauthorized access to system resources."
  - id: "ASVS-V8-8.2.4"
    section: "V8.2"
    level: 3
    rule: "Adaptive security controls based on a consumer's environmental and contextual attributes (such as time of day, location, IP address, or device) are implemented for authentication and authorization decisions, as defined in the application's documentation. These controls must be applied when the consumer tries to start a new session and also during an existing session."
  - id: "ASVS-V8-8.3.1"
    section: "V8.3"
    level: 1
    rule: "The application enforces authorization rules at a trusted service layer and doesn't rely on controls that an untrusted consumer could manipulate, such as client-side JavaScript."
    cwe:
      id: 602
      name: "Client-Side Enforcement of Server-Side Security"
      abstraction: "Class"
      url: "https://cwe.mitre.org/data/definitions/602.html"
      note: "Client-side validation checks can be easily bypassed, allowing malformed or unexpected input to pass into the application, potentially as trusted data. This may lead to unexpected states, behaviors and possibly a resulting crash.\n\nClient-side checks for authentication can be easily bypassed, allowing clients to escalate their access levels and perform unintended actions."
  - id: "ASVS-V8-8.3.2"
    section: "V8.3"
    level: 3
    rule: "Changes to values on which authorization decisions are made are applied immediately. Where changes cannot be applied immediately, (such as when relying on data in self-contained tokens), there must be mitigating controls to alert when a consumer performs an action when they are no longer authorized to do so and revert the change. Note that this alternative would not mitigate information leakage."
  - id: "ASVS-V8-8.3.3"
    section: "V8.3"
    level: 3
    rule: "Access to an object is based on the originating subject's (e.g. consumer's) permissions, not on the permissions of any intermediary or service acting on their behalf. For example, if a consumer calls a web service using a self-contained token for authentication, and the service then requests data from a different service, the second service will use the consumer's token, rather than a machine-to-machine token from the first service, to make permission decisions."
    cwe:
      id: 441
      name: "Unintended Proxy or Intermediary ('Confused Deputy')"
      abstraction: "Class"
      url: "https://cwe.mitre.org/data/definitions/441.html"
  - id: "ASVS-V8-8.4.1"
    section: "V8.4"
    level: 2
    rule: "Multi-tenant applications use cross-tenant controls to ensure consumer operations will never affect tenants with which they do not have permissions to interact."
    cwe:
      id: 283
      name: "Unverified Ownership"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/283.html"
      note: "An attacker could gain unauthorized access to system resources."
  - id: "ASVS-V8-8.4.2"
    section: "V8.4"
    level: 3
    rule: "Access to administrative interfaces incorporates multiple layers of security, including continuous consumer identity verification, device security posture assessment, and contextual risk analysis, ensuring that network location or trusted endpoints are not the sole factors for authorization even though they may reduce the likelihood of unauthorized access."
    cwe:
      id: 419
      name: "Unprotected Primary Channel"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/419.html"

# asvs-v9-rules.yml
# Verifiable requirements distilled from OWASP ASVS 5.0.0 - V9 Self-contained Tokens.
meta:
  prefix: "ASVS"
  standard: "OWASP ASVS 5.0.0"
  source: "references/0x18-V9-Self-contained-Tokens.md"
  chapter: "V9"
  title: "Self-contained Tokens"
  requirements: 7
  per_level: {L1: 4, L2: 3, L3: 0}
  cwe:
    mapped: 3
    mapping: "scripts/asvs-5.0.0-cwe-mapping.yml (derived from OWASP ASVS 5.0.be, indicative only)"
    catalogs:
      - "cwe.xml: CWE 4.20 (2026-04-30), VIEW LIST: CWE-699: Software Development"
      - "cwec_v4.20.xml: CWE 4.20 (2026-04-30), CWE"
  sections:
    - id: "V9.1"
      title: "Token source and integrity"
    - id: "V9.2"
      title: "Token content"
rules:
  - id: "ASVS-V9-9.1.1"
    section: "V9.1"
    level: 1
    rule: "Self-contained tokens are validated using their digital signature or MAC to protect against tampering before accepting the token's contents."
    cwe:
      id: 345
      name: "Insufficient Verification of Data Authenticity"
      abstraction: "Class"
      url: "https://cwe.mitre.org/data/definitions/345.html"
  - id: "ASVS-V9-9.1.2"
    section: "V9.1"
    level: 1
    rule: "Only algorithms on an allowlist can be used to create and verify self-contained tokens, for a given context. The allowlist must include the permitted algorithms, ideally only either symmetric or asymmetric algorithms, and must not include the 'None' algorithm. If both symmetric and asymmetric must be supported, additional controls will be needed to prevent key confusion."
    cwe:
      id: 757
      name: "Selection of Less-Secure Algorithm During Negotiation ('Algorithm Downgrade')"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/757.html"
  - id: "ASVS-V9-9.1.3"
    section: "V9.1"
    level: 1
    rule: "Key material that is used to validate self-contained tokens is from trusted pre-configured sources for the token issuer, preventing attackers from specifying untrusted sources and keys. For JWTs and other JWS structures, headers such as 'jku', 'x5u', and 'jwk' must be validated against an allowlist of trusted sources."
  - id: "ASVS-V9-9.2.1"
    section: "V9.2"
    level: 1
    rule: "Verify that, if a validity time span is present in the token data, the token and its content are accepted only if the verification time is within this validity time span. For example, for JWTs, the claims 'nbf' and 'exp' must be verified."
    cwe:
      id: 613
      name: "Insufficient Session Expiration"
      abstraction: "Base"
      url: "https://cwe.mitre.org/data/definitions/613.html"
  - id: "ASVS-V9-9.2.2"
    section: "V9.2"
    level: 2
    rule: "The service receiving a token validates the token to be the correct type and is meant for the intended purpose before accepting the token's contents. For example, only access tokens can be accepted for authorization decisions and only ID Tokens can be used for proving user authentication."
  - id: "ASVS-V9-9.2.3"
    section: "V9.2"
    level: 2
    rule: "The service only accepts tokens which are intended for use with that service (audience). For JWTs, this can be achieved by validating the 'aud' claim against an allowlist defined in the service."
  - id: "ASVS-V9-9.2.4"
    section: "V9.2"
    level: 2
    rule: "Verify that, if a token issuer uses the same private key for issuing tokens to different audiences, the issued tokens contain an audience restriction that uniquely identifies the intended audiences. This will prevent a token from being reused with an unintended audience. If the audience identifier is dynamically provisioned, the token issuer must validate these audiences in order to make sure that they do not result in audience impersonation."
